# ============================================================================
# Klivo — a Klivo webhosting platformon fut (Traefik + izolált kliens-hálózat).
#
# A platform KÖTÖTT elvárásai. Ezek nélkül a panel néhány másodperc után
# "stopped"-ot mutat (a metrika-poller a hosting_klivo_web nevet keresi, és ha
# nem találja, 'missing' → 'stopped'), a Traefik pedig 502 Bad Gateway-t ad:
#   • konténer neve PONTOSAN:   hosting_klivo_web   (slug = "klivo")
#   • hálózat:                  client_klivo_net    (external — a platform hozza létre)
#   • belső port:               3000                (a panelon a "Container port" is 3000)
#
# A Traefik ezen a hálózaton, KONTÉNERNÉV szerint éri el az appot
# (http://hosting_klivo_web:3000), ezért NEM publikálunk portot a hostra
# (a régi "3000:3000" + network_mode: bridge miatt volt a Bad Gateway).
#
# E-MAIL KIKAPCSOLVA: a kapcsolat közvetlen e-mail/telefon linkeken megy, így
# nincs SMTP háttérszolgáltatás. (Lásd docs/decisions/0005-disable-email.md.)
# ============================================================================
services:
  web:
    build:
      context: .
    # A platform e pontos név alapján figyeli az állapotot ÉS route-ol rá.
    container_name: hosting_klivo_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    # Csak a konténerhálózaton belül elérhető port (a Next.js a 3000-en figyel).
    # Nincs host-oldali publikálás: több kliens is futhat egy VPS-en ütközés nélkül.
    expose:
      - "3000"
    networks:
      - client_klivo_net

networks:
  # A platform API hozza létre ezt a hálózatot és csatolja rá a Traefiket; itt
  # csak KÜLSŐKÉNT hivatkozunk rá. Ne definiáld újra, és ne válts vissza
  # network_mode: bridge-re — különben a Traefik nem éri el a konténert.
  client_klivo_net:
    external: true
