# Klivo — egy konténer, 3000-es port.
#
# A tárhelyszolgáltatás a 3000-es portra irányít, ezért a konténer is azon figyel.
services:
  klivo_web:
    build:
      context: .
      args:
        # Build időben ég bele a kliens bundle-be. Meg kell egyeznie az éles
        # domainnel, különben minden canonical URL, OG tag és sitemap bejegyzés
        # máshová mutat.
        NEXT_PUBLIC_SITE_URL: https://klivo.hu
    # A Traefik a hosting_{ugyfel}_web nevre routol — a nevnek egyeznie kell,
    # kulonben a proxy nem talalja meg a konténert (502).
    container_name: hosting_klivo_web
    restart: unless-stopped

    # Innen jön futásidőben az ADMIN_JWT_SECRET, ADMIN_USERNAME és
    # ADMIN_PASSWORD_HASH. Lásd .env.example.
    env_file:
      - .env

    # Nincs kozvetlen host port: a forgalom a Traefiken keresztul jon, az
    # intezi a HTTPS-t is. A panelben a container_port legyen 3000.
    expose:
      - '3000'

    # A Traefik ezen a halozaton eri el a konténert. A halozatot a platform
    # hozza letre a deploy elott, ezert external.
    networks:
      - client_klivo_net

    volumes:
      # Bejegyzések, megkeresések, beállítások. Enélkül az oldal minden
      # deploynál üres blogra és üres postaládára áll vissza.
      - klivo_data:/app/data
      # Az adminban feltöltött képek.
      - klivo_uploads:/app/public/uploads

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    # Konténer szintű szigorítás.
    #
    # A `read_only: true` szándékosan NINCS beállítva. A Next.js ISR frissített
    # HTML-t ír a /app/.next/server/app/*.html alá, és egy csak olvasható
    # gyökérrel minden revalidáció EROFS hibával bukna — naplózva, de nem
    # végzetesen, vagyis a tünet néma: az oldal a build idejű pillanatképet
    # szolgálná ki, és soha nem venné észre az új bejegyzéseket.
    #
    # A `security_opt: no-new-privileges:true` szándékosan NINCS itt: a
    # tárhelyplatform compose-ellenőrzése minden `security_opt` kulcsot
    # elutasít (érték nélkül, kulcs alapján), így a deploy elbukna rajta.
    # A folyamat továbbra is jogosulatlan felhasználóként fut (lásd Dockerfile).
    tmpfs:
      - /tmp

volumes:
  klivo_data:
  klivo_uploads:

networks:
  client_klivo_net:
    external: true
