<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- PLACEHOLDER: ajánlott egy 1200×630 PNG export a megosztásokhoz (egyes
       platformok az SVG OG-képet nem jelenítik meg megbízhatóan). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F3FF"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B6BFF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B5BFF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop stop-color="#C9B6FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C9B6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Márkajel + névsor -->
  <g transform="translate(90 84)">
    <rect width="64" height="64" rx="17" fill="url(#mark)"/>
    <path d="M22 19v26M22 32l14-13M22 32l14 13" stroke="#fff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="44" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="700" fill="#0E0F14">Klivo</text>
  </g>

  <!-- Főcím -->
  <text x="90" y="300" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="74" font-weight="700" letter-spacing="-2" fill="#0E0F14">Weboldalak, amelyeket</text>
  <text x="90" y="384" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="74" font-weight="700" letter-spacing="-2" fill="url(#accent)">megtalálnak.</text>

  <!-- Alcím -->
  <text x="92" y="452" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="400" fill="#3A3D49">Professzionális weboldal készítés erős SEO-val és AI-láthatósággal.</text>

  <!-- Lábsor -->
  <g font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="600" fill="#3B5BFF">
    <text x="92" y="545">Weboldal 100 000 Ft-tól</text>
    <text x="430" y="545" fill="#6B6F7D" font-weight="400">·</text>
    <text x="460" y="545">SEO + AI SEO</text>
    <text x="690" y="545" fill="#6B6F7D" font-weight="400">·</text>
    <text x="720" y="545">Tárhely megoldások</text>
  </g>
</svg>
